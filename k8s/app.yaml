apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: boxoffice
spec:
  type: ClusterIP
  selector:
    app: boxoffice-app
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boxoffice-app
  namespace: boxoffice
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: boxoffice-app
  template:
    metadata:
      labels:
        app: boxoffice-app
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: __REGISTRY__/boxoffice-app:__TAG__
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: boxoffice-config
            - secretRef:
                name: mongo-app
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
